irrf_lei_15270_reduction:
  enabled: true
  legal_reference: "Lei nº 15.270/2025, Arts. 2º e 3º (Art. 3º-A da Lei nº 9.250/1995)"
  full_exemption_limit: 5000.00
  max_reduction_amount: 312.89
  transition_upper_limit: 7350.00
  transition_constant: 978.62
  transition_slope: 0.133145

pj_defaults:
  require_nfse: true
  nfse_due_day: 5
  auto_proportional_dates: true
  default_iss_rate: 0.0
  default_irrf_rate: 0.0
  default_pcc_rate: 0.0
  legal_note: "Contratos PJ (B2B): sem encargos CLT (INSS empregado, FGTS, 13º, Férias ou VT). Controle focado em valor a emitir na NFS-e e eventuais retenções na fonte configuradas."
